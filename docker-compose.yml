services:
  auntie-chen-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: auntie-chen-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4174}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      CMS_SQLITE_FILE: /app/data/cms.sqlite
      ADMIN_SESSION_TOKEN: ${ADMIN_SESSION_TOKEN:-local-admin-token}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
