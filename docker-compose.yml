services:
  auntie-chen-cn-showcase:
    build:
      context: .
      dockerfile: Dockerfile
    image: auntie-chen-cn-showcase:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4175}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
