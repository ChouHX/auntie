services:
  auntie-chen-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: auntie-chen-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4174}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      CMS_SQLITE_FILE: /app/data/cms.sqlite
      ADMIN_SESSION_TOKEN: ${ADMIN_SESSION_TOKEN:-local-admin-token}
      AIRWALLEX_ENV: ${AIRWALLEX_ENV:-production}
      AIRWALLEX_CLIENT_ID: ${AIRWALLEX_CLIENT_ID:-}
      AIRWALLEX_API_KEY: ${AIRWALLEX_API_KEY:-}
      AIRWALLEX_WEBHOOK_SECRET: ${AIRWALLEX_WEBHOOK_SECRET:-}
      AIRWALLEX_ACCOUNT_ID: ${AIRWALLEX_ACCOUNT_ID:-}
      AIRWALLEX_API_BASE_URL: ${AIRWALLEX_API_BASE_URL:-}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - ./public/ea9635bd310eca9616f21f0ed8475502.txt:/app/public/ea9635bd310eca9616f21f0ed8475502.txt:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
