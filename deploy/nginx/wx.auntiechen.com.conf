# 用法：
#   sudo cp deploy/nginx/wx.auntiechen.com.conf /etc/nginx/conf.d/wx.auntiechen.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 基于 certbot 签发后的配置整理：
#   - 80 强制跳转到 HTTPS
#   - 443 反代到本机 Docker 展示站 127.0.0.1:4175
#   - 证书路径保持 certbot 默认位置

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wx.auntiechen.com;

    # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wx.auntiechen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wx.auntiechen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    access_log /var/log/nginx/wx.auntiechen.com.access.log main;
    error_log  /var/log/nginx/wx.auntiechen.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wx.auntiechen.com;

    return 301 https://$host$request_uri;
}
